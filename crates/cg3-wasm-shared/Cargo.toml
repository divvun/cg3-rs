[package]
name = "cg3-wasm-shared"
# Versioned with @divvun/cg3, whose two modules link it.
version = "0.6.0"
edition.workspace = true
description = "What both of @divvun/cg3's WebAssembly modules start, log and fail through"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The modules link it; it reaches users only inside the npm package.
publish = false

[lints.rust]
unsafe_code = "forbid"

[features]
# Exports a small owned object, a panic and log events for the JavaScript test
# suite, from whichever module turns it on.
test-hooks = []

[dependencies]
cg3 = { path = "../cg3", version = "0.5.0" }
# Pinned with crates/cg3-wasm's: one wasm-bindgen generates both modules' glue.
wasm-bindgen = "=0.2.118"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
tracing = "0.1"
