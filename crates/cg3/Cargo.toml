[package]
name = "cg3"
version.workspace = true
edition.workspace = true
description = "VISL CG-3 (Constraint Grammar) engine — Rust port"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["constraint-grammar", "nlp", "linguistics", "cg3"]
categories = ["text-processing"]

[lints.rust]
# The whole crate — lib, examples, tests — is unsafe-free; the one
# historically-unsafe construct (address-keyed unification identity) was
# re-keyed off values. Enforced here so every target inherits the forbid.
unsafe_code = "forbid"

[lib]
name = "cg3"
path = "src/lib.rs"

[features]
default = []
# The profiler, which persists to a SQLite database via rusqlite (bundled
# SQLite). Off by default so the base build pulls in no C toolchain / SQLite;
# cg3-cli's `profiler` feature turns it on for `vislcg3 --profile` and the
# cg-annotate / cg-merge-annotations report tools.
profiler = ["dep:rusqlite"]

[dependencies]
# UTF-8 + regex-crate (Unicode by default) replaces ICU's uregex; parity-checked
# per the porting notes.
regex = "1"
# JSONL applicator (replaces RapidJSON).
serde_json = "1"
# Profiler DB (replaces the C sqlite3 API) — only pulled in by the `profiler` feature.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# All diagnostics/logging (the C++ ux_stderr/std::cerr messages) are tracing
# events; whoever runs the library installs the subscriber (cg3-cli: stderr).
tracing = "0.1"
# Typed bit-flag sets (T_*/ST_*/CT_*/RF_*/POS_* families) per the sanctioned idiom list.
bitflags = "2"
# Tag + text-delimiter patterns come from grammars authored against ICU, so they
# use lookaround, backreferences and possessive quantifiers that the `regex`
# crate cannot express (and, for possessives, silently mis-parses). fancy-regex
# covers them and is ICU-exact on possessive semantics. It delegates
# non-backtracking patterns to regex-automata internally, so the common case
# keeps the linear-time engine without a hand-rolled fast path. See
# `src/tag_regex.rs` for the seam and the backtrack limit.
fancy-regex = "0.19"
thiserror = "2.0.20"
# Source-quoting diagnostics for grammar syntax errors (src/diagnostics.rs).
# The `auto-color` feature (concolor) is deliberately NOT enabled: this crate
# already decides colour from `IsTerminal` on the stream it is writing to, per
# `[spec:cg3:req:diagnostics.colour-at-tty]`, and a second detector reading
# process-global state would only disagree with it.
ariadne = "0.6"
