[package]
name = "cg3-python"
version.workspace = true
edition.workspace = true
description = "pyo3 glue behind divvun-cg3, VISL CG-3 for Python"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The glue reaches users only through the divvun-cg3 package under python/,
# which maturin builds from this crate.
publish = false

[lints.rust]
unsafe_code = "forbid"

# An extension module leaves the Python symbols for the interpreter, so no
# Rust test binary can link against it: python/tests tests it through Python.
[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
cg3 = { path = "../cg3", version = "0.5.0" }
# The stable ABI from CPython 3.11, so one wheel per platform serves every
# release from 3.11 on.
pyo3 = { version = "0.30", features = ["abi3-py311"] }
tracing = "0.1"
