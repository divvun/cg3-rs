[package]
name = "cg3-wasm"
# The version of @divvun/cg3, which is versioned on its own and released from a
# `wasm/v<version>` tag; the library it binds keeps the workspace version.
version = "0.5.0"
edition.workspace = true
description = "wasm-bindgen glue behind @divvun/cg3, VISL CG-3 for JavaScript"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The glue reaches users only through the npm package under js/cg3.
publish = false

[lints.rust]
unsafe_code = "forbid"

# The rlib is for the host tests, which call the glue's plain Rust functions.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Exports a small owned object, a panic and log events for the JavaScript test
# suite. Only `js/build.mjs --test` turns it on, and that build writes outside
# the package directory.
test-hooks = ["cg3-wasm-shared/test-hooks"]

[dependencies]
cg3 = { path = "../cg3", version = "0.5.0" }
cg3-wasm-shared = { path = "../cg3-wasm-shared" }
# Pinned: the wasm-bindgen CLI that generates the JavaScript glue must be this
# exact version, or the module it writes does not match the one built here.
wasm-bindgen = "=0.2.118"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
tracing = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# tests/parity.rs runs cg-comp and vislcg3 in its own process, to compare the
# binding with them. The tools need processes, so the wasm32 tests go without.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cg3-cli = { path = "../cg3-cli" }
