[package]
name = "cg3-swift-compile"
# Versioned with divvun.cg3, as crates/cg3-swift is.
version = "0.1.0"
edition.workspace = true
description = "UniFFI glue behind CG3Compile, divvun.cg3's product that compiles and writes VISL CG-3 grammars in Swift"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
cg3 = { path = "../cg3", version = "0.5.0" }
cg3-swift = { path = "../cg3-swift" }
uniffi = { version = "0.32", default-features = false }
