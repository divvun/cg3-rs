[package]
name = "cg3-wasm-compile"
# The version of @divvun/cg3, which crates/cg3-wasm carries; this module's
# version() reports it too, and a test holds the two equal.
version = "0.5.0"
edition.workspace = true
description = "wasm-bindgen glue behind @divvun/cg3/compile, which compiles and writes VISL CG-3 grammars in JavaScript"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The glue reaches users only through the npm package under js/cg3.
publish = false

[lints.rust]
unsafe_code = "forbid"

# The rlib is for the host tests, which call the glue's plain Rust functions.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The test hooks of cg3-wasm-shared, in this module. Only
# `js/build.mjs --test` turns it on.
test-hooks = ["cg3-wasm-shared/test-hooks"]

[dependencies]
cg3 = { path = "../cg3", version = "0.5.0" }
cg3-wasm-shared = { path = "../cg3-wasm-shared" }
# Pinned with crates/cg3-wasm's: one wasm-bindgen CLI generates both modules'
# glue.
wasm-bindgen = "=0.2.118"
js-sys = "0.3"

[dev-dependencies]
serde_json = "1"
