[workspace]
resolver = "3"
members = ["crates/cg3", "crates/cg3-cli", "crates/cg3-wasm"]

# One version for the library and the tools: every banner reports it.
[workspace.package]
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/divvun/cg3-rs"
homepage = "https://github.com/divvun/cg3-rs"

# The npm package's build (crates/cg3-wasm/package.sh): small over fast, since
# every user downloads it.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
