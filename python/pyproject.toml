[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "divvun-cg3"
# maturin takes the version from crates/cg3-python, which is the library's.
dynamic = ["version"]
description = "VISL CG-3 (Constraint Grammar) for Python: loads compiled and textual grammars and runs them, giving the output vislcg3 gives."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
# A link to the repository's COPYING: a licence file may not lie outside the
# project directory.
license-files = ["COPYING"]
authors = [{ name = "UiT The Arctic University of Norway" }]
keywords = ["constraint-grammar", "cg3", "vislcg3", "divvun", "nlp", "linguistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/divvun/cg3-rs/tree/main/python#readme"
Repository = "https://github.com/divvun/cg3-rs"
Issues = "https://github.com/divvun/cg3-rs/issues"

[tool.maturin]
manifest-path = "../crates/cg3-python/Cargo.toml"
module-name = "cg3._cg3"
python-source = "."

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["cg3", "tests"]
mypy_path = "tests"

[dependency-groups]
dev = ["maturin>=1.9.4,<2", "pytest>=8", "mypy>=1.13"]
