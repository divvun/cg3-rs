name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned (not `@stable`) so a new clippy release can't spontaneously fail CI
      # with lints unrelated to a change. Bump deliberately.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # `--all-targets` builds lib + bins + examples + tests, so these two steps
      # are the full compile-and-lint gate. `--features profiler` additionally
      # pulls in rusqlite + the cg-annotate / cg-merge-annotations binaries.
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (profiler feature)
        run: cargo clippy --workspace --all-targets --features profiler -- -D warnings

      # The npm package builds the library for wasm32, where usize is 32 bits
      # wide; this is the build that catches code assuming 64.
      - name: Check (library, wasm32)
        run: cargo check -p cg3 --lib --target wasm32-unknown-unknown

      - name: Tests (default features)
        run: cargo nextest run --workspace

      - name: Tests (profiler feature)
        run: cargo nextest run --workspace --features profiler

      - name: Doctests
        run: cargo test --workspace --doc

  wasm:
    name: wasm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The CLI must be the exact version cg3-wasm pins (package.sh checks).
      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.118

      - name: Install wasm-opt
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_123/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: denoland/setup-deno@v2

      - name: Tests under Node
        run: cargo test -p cg3-wasm --target wasm32-unknown-unknown

      - name: Build the package
        run: crates/cg3-wasm/package.sh

      - name: Build the tools
        run: cargo build -p cg3-cli

      - name: Load the package in Node
        run: |
          target/debug/cg-comp test/T_Select/grammar.cg3 "$RUNNER_TEMP/select.cg3b"
          node crates/cg3-wasm/smoke/node.mjs "$RUNNER_TEMP/select.cg3b" test/T_Select/input.txt test/T_Select/expected.txt

      - name: Type-check the declarations in Deno
        working-directory: crates/cg3-wasm/smoke
        run: deno check

      - name: Parity with vislcg3 over the corpus
        run: node crates/cg3-wasm/parity/parity.mjs target/debug test
